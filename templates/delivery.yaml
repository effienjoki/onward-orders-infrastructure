AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Onward Logistics order delivery (child of the root stack). EventBridge starts
  CodePipeline when a new image is pushed to ECR. CodePipeline hands it to
  CodeDeploy, which releases it to ECS with a blue/green canary and automatic rollback.

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, test, prod]
  ConnectionArn:
    Type: String
  AppRepository:
    Type: String
  AppBranch:
    Type: String
  RepositoryName:
    Type: String
  RepositoryArn:
    Type: String
  ClusterName:
    Type: String
  ServiceName:
    Type: String
  ProductionListenerArn:
    Type: String
  BlueTargetGroupName:
    Type: String
  GreenTargetGroupName:
    Type: String
  TaskExecutionRoleArn:
    Type: String

Resources:

  # ---------- Artifact bucket: hands files between pipeline stages ----------

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub onward-${Environment}-orders-artifacts-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldArtifacts
            Status: Enabled
            ExpirationInDays: 14

  # ---------- CodeDeploy: blue/green on ECS ----------

  CodeDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Lets CodeDeploy run blue/green releases on the order service.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS

  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub onward-${Environment}-orders
      ComputePlatform: ECS

  DeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub onward-${Environment}-orders-dg
      ServiceRoleArn: !GetAtt CodeDeployRole.Arn
      DeploymentConfigName: CodeDeployDefault.ECSCanary10Percent5Minutes
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
          WaitTimeInMinutes: 0
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: 10
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE
          - DEPLOYMENT_STOP_ON_REQUEST
      ECSServices:
        - ClusterName: !Ref ClusterName
          ServiceName: !Ref ServiceName
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - TargetGroups:
              - Name: !Ref BlueTargetGroupName
              - Name: !Ref GreenTargetGroupName
            ProdTrafficRoute:
              ListenerArns:
                - !Ref ProductionListenerArn

  # ---------- CodePipeline: what it may do ----------

  PipelinePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Permissions the order pipeline needs, and nothing else.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: Artifacts
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:PutObject
              - s3:GetBucketLocation
              - s3:GetBucketVersioning
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub ${ArtifactBucket.Arn}/*
          - Sid: ReadNewImage
            Effect: Allow
            Action: ecr:DescribeImages
            Resource: !Ref RepositoryArn
          - Sid: ReadAppRepoFiles
            Effect: Allow
            Action:
              - codestar-connections:UseConnection
              - codeconnections:UseConnection
            Resource: !Ref ConnectionArn
          - Sid: StartReleases
            Effect: Allow
            Action:
              - codedeploy:CreateDeployment
              - codedeploy:GetDeployment
              - codedeploy:GetApplication
              - codedeploy:GetApplicationRevision
              - codedeploy:RegisterApplicationRevision
              - codedeploy:GetDeploymentConfig
            Resource: !Sub arn:aws:codedeploy:${AWS::Region}:${AWS::AccountId}:*
          - Sid: RegisterTaskDefinitions
            Effect: Allow
            Action:
              - ecs:RegisterTaskDefinition
              - ecs:DescribeTaskDefinition
              - ecs:TagResource
            Resource: '*'
          - Sid: PassExecutionRoleToEcsOnly
            Effect: Allow
            Action: iam:PassRole
            Resource: !Ref TaskExecutionRoleArn
            Condition:
              StringEquals:
                iam:PassedToService: ecs-tasks.amazonaws.com

  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Assumed by CodePipeline to release the order service.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref PipelinePolicy

  # ---------- CodePipeline ----------

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub onward-${Environment}-orders-pipeline
      PipelineType: V2
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: NewImage
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: ECR
                Version: '1'
              Configuration:
                RepositoryName: !Ref RepositoryName
                ImageTag: latest
              OutputArtifacts:
                - Name: ImageArtifact
            - Name: DeployFiles
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref ConnectionArn
                FullRepositoryId: !Ref AppRepository
                BranchName: !Ref AppBranch
                DetectChanges: false
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: DeployFilesArtifact
        - Name: Deploy
          Actions:
            - Name: BlueGreenRelease
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: '1'
              InputArtifacts:
                - Name: ImageArtifact
                - Name: DeployFilesArtifact
              Configuration:
                ApplicationName: !Ref CodeDeployApplication
                DeploymentGroupName: !Ref DeploymentGroup
                TaskDefinitionTemplateArtifact: DeployFilesArtifact
                TaskDefinitionTemplatePath: deploy/taskdef.json
                AppSpecTemplateArtifact: DeployFilesArtifact
                AppSpecTemplatePath: deploy/appspec.yaml
                Image1ArtifactName: ImageArtifact
                Image1ContainerName: IMAGE1_NAME

  # ---------- EventBridge: start the pipeline when :latest is pushed ----------

  EventsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Lets EventBridge start the order pipeline only.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: codepipeline:StartPipelineExecution
            Resource: !Sub arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}

  EventsRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Assumed by EventBridge to start the order pipeline.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref EventsPolicy

  ImagePushedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub onward-${Environment}-orders-image-pushed
      Description: Start the order pipeline when a new latest image is pushed.
      EventPattern:
        source:
          - aws.ecr
        detail-type:
          - ECR Image Action
        detail:
          action-type:
            - PUSH
          result:
            - SUCCESS
          repository-name:
            - !Ref RepositoryName
          image-tag:
            - latest
      Targets:
        - Id: OrderPipeline
          Arn: !Sub arn:aws:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}
          RoleArn: !GetAtt EventsRole.Arn

Outputs:
  PipelineName:
    Value: !Ref Pipeline
  CodeDeployApplication:
    Value: !Ref CodeDeployApplication