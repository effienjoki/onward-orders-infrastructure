AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Onward Logistics order service on ECS Fargate. Internet facing ALB in public
  subnets, tasks in private subnets, blue and green target groups for CodeDeploy
  blue/green releases, and CPU based scaling between 2 and 6 tasks.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
  MinTasks:
    Type: Number
    Default: 2
  MaxTasks:
    Type: Number
    Default: 6
  CpuTarget:
    Type: Number
    Default: 50

Resources:

  # ---------- Security groups ----------

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub onward-${Environment}-orders-alb-sg
      GroupDescription: Public entry point. HTTP from the internet to the load balancer only.
      VpcId:
        Fn::ImportValue: !Sub onward-${Environment}-ecs-network-VpcId
      SecurityGroupIngress:
        - Description: HTTP from customers and merchants
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub onward-${Environment}-orders-alb-sg

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub onward-${Environment}-orders-task-sg
      GroupDescription: Order tasks. App port from the load balancer only. No admin ports.
      VpcId:
        Fn::ImportValue: !Sub onward-${Environment}-ecs-network-VpcId
      SecurityGroupIngress:
        - Description: App traffic from the load balancer only
          IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub onward-${Environment}-orders-task-sg

  # ---------- Load balancer with blue and green target groups ----------

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub onward-${Environment}-orders-alb
      Type: application
      Scheme: internet-facing
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets: !Split
        - ','
        - Fn::ImportValue: !Sub onward-${Environment}-ecs-network-PublicSubnetIds

  BlueTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub onward-${Environment}-orders-blue
      VpcId:
        Fn::ImportValue: !Sub onward-${Environment}-ecs-network-VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  GreenTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub onward-${Environment}-orders-green
      VpcId:
        Fn::ImportValue: !Sub onward-${Environment}-ecs-network-VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  ProductionListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BlueTargetGroup

  # ---------- ECS cluster, logs and the execution role ----------

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub onward-${Environment}-orders-cluster

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/onward-${Environment}-orders
      RetentionInDays: 7

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Used by ECS to start order tasks. Pull the image from ECR and write logs. Nothing else.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # ---------- Task definition: how to run the order container ----------

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub onward-${Environment}-orders
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ContainerDefinitions:
        - Name: orders-app
          Image: !Sub
            - '${RepoUri}:latest'
            - RepoUri:
                Fn::ImportValue: !Sub onward-${Environment}-orders-bootstrap-RepositoryUri
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: orders

  # ---------- Service: keeps tasks running, released by CodeDeploy ----------

  Service:
    Type: AWS::ECS::Service
    DependsOn: ProductionListener
    Properties:
      ServiceName: !Sub onward-${Environment}-orders-service
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref MinTasks
      HealthCheckGracePeriodSeconds: 60
      DeploymentController:
        Type: CODE_DEPLOY
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref TaskSecurityGroup
          Subnets: !Split
            - ','
            - Fn::ImportValue: !Sub onward-${Environment}-ecs-network-PrivateSubnetIds
      LoadBalancers:
        - ContainerName: orders-app
          ContainerPort: 8080
          TargetGroupArn: !Ref BlueTargetGroup

  # ---------- Scaling: 2 to 6 tasks, keep average CPU near the target ----------

  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub service/${Cluster}/${Service.Name}
      MinCapacity: !Ref MinTasks
      MaxCapacity: !Ref MaxTasks

  CpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub onward-${Environment}-orders-cpu-target
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: !Ref CpuTarget
        ScaleOutCooldown: 60
        ScaleInCooldown: 120

Outputs:
  LoadBalancerUrl:
    Description: The single public address of the order system.
    Value: !Sub http://${LoadBalancer.DNSName}
  ClusterName:
    Value: !Ref Cluster
    Export:
      Name: !Sub onward-${Environment}-ecs-service-ClusterName
  ServiceName:
    Value: !GetAtt Service.Name
    Export:
      Name: !Sub onward-${Environment}-ecs-service-ServiceName
  ProductionListenerArn:
    Value: !Ref ProductionListener
    Export:
      Name: !Sub onward-${Environment}-ecs-service-ProductionListenerArn
  BlueTargetGroupName:
    Value: !GetAtt BlueTargetGroup.TargetGroupName
    Export:
      Name: !Sub onward-${Environment}-ecs-service-BlueTargetGroupName
  GreenTargetGroupName:
    Value: !GetAtt GreenTargetGroup.TargetGroupName
    Export:
      Name: !Sub onward-${Environment}-ecs-service-GreenTargetGroupName
  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn
    Export:
      Name: !Sub onward-${Environment}-ecs-service-TaskExecutionRoleArn